<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> :3 </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Petit+Formal+Script&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blush: #f7e9ee;
    --blush-deep: #f0d3de;
    --pink: #e8b4c8;
    --pink-hot: #d98cae;
    --rose-line: #c98aa3;
    --ink: #3a2c33;
    --ink-soft: #8a7580;
    --white: #fffaf9;
    --locked: #d9d2d5;
    --locked-text: #a89ba2;
    --done: #2b2126;
    --done-text: #cbb9c0;
    --shadow: 0 8px 24px rgba(180, 110, 140, 0.18);
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    background-color: var(--blush);
    background-image: radial-gradient(circle, rgba(200,140,165,0.35) 1px, transparent 1.4px);
    background-size: 26px 26px;
    color: var(--ink);
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    padding-bottom: 80px;
  }

  header{
    text-align:center;
    padding: 56px 20px 28px;
    position: relative;
  }

  .eyebrow{
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--pink-hot);
    font-weight: 600;
  }

  h1{
    font-family: 'Petit Formal Script', cursive;
    font-size: 74px;
    font-weight: 400;
    color: var(--ink);
    line-height: 1;
    margin-top: 6px;
    text-shadow: 2px 2px 0 rgba(255,255,255,0.6);
  }

  .subtitle{
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 15px;
    color: var(--ink-soft);
    margin-top: 10px;
    letter-spacing: 0.3px;
  }

  .progress-wrap{
    max-width: 480px;
    margin: 30px auto 0;
    padding: 0 20px;
  }

  .progress-label{
    display:flex;
    justify-content: space-between;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }

  .progress-track{
    height: 10px;
    background: var(--white);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: inset 0 1px 4px rgba(0,0,0,0.08);
    border: 1px solid rgba(217,140,174,0.4);
  }

  .progress-fill{
    height: 100%;
    background: linear-gradient(90deg, var(--pink) 0%, var(--pink-hot) 100%);
    width: 0%;
    transition: width 0.6s ease;
    border-radius: 20px;
  }

  .stats{
    display:flex;
    justify-content:center;
    gap: 28px;
    margin-top: 22px;
    flex-wrap: wrap;
  }
  .stat{
    text-align:center;
  }
  .stat .num{
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 26px;
    color: var(--pink-hot);
  }
  .stat .lbl{
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .toolbar{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-top:26px;
    flex-wrap: wrap;
    padding: 0 20px;
  }
  .btn{
    font-family:'Poppins', sans-serif;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 10px 18px;
    border-radius: 30px;
    border: 1px solid var(--pink-hot);
    background: var(--white);
    color: var(--pink-hot);
    cursor:pointer;
    transition: all .2s ease;
  }
  .btn:hover{
    background: var(--pink-hot);
    color: var(--white);
  }

  main{
    max-width: 1500px;
    margin: 46px auto 0;
    padding: 0 24px;
    overflow-x: auto;
  }

  .malla{
    display:grid;
    grid-auto-flow: column;
    grid-auto-columns: 190px;
    gap: 14px;
    align-items: start;
    padding-bottom: 20px;
  }

  .col{
    display:flex;
    flex-direction: column;
    gap: 10px;
  }

  .col-head{
    text-align:center;
    padding: 6px 0 10px;
  }
  .col-head .sem{
    font-family:'Playfair Display', serif;
    font-style: italic;
    font-weight: 700;
    font-size: 15px;
    color: var(--ink);
  }
  .col-head .via{
    font-size: 9px;
    color: var(--pink-hot);
    letter-spacing: 0.5px;
    margin-top: 2px;
    text-transform: uppercase;
  }

  .card{
    background: var(--white);
    border-radius: 14px;
    padding: 12px 12px 10px;
    box-shadow: var(--shadow);
    border: 1px solid rgba(217,140,174,0.35);
    cursor: pointer;
    min-height: 92px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    transition: transform .18s ease, box-shadow .18s ease, background .25s ease, filter .25s ease;
    position: relative;
  }
  .card:hover{
    transform: translateY(-3px);
  }

  .card .code{
    font-size: 9px;
    letter-spacing: 1px;
    color: var(--ink-soft);
    text-transform: uppercase;
  }
  .card .name{
    font-family: 'Playfair Display', serif;
    font-size: 12.5px;
    line-height: 1.3;
    margin-top: 4px;
    color: var(--ink);
  }
  .card .credits{
    margin-top: 8px;
    font-size: 9px;
    color: var(--ink-soft);
    letter-spacing: 0.4px;
  }
  .card .badge{
    position:absolute;
    top: 8px;
    right: 10px;
    font-size: 13px;
  }

  /* estado: disponible (no hecho, desbloqueado) */
  .card.available{
    background: linear-gradient(160deg, var(--white) 60%, var(--blush-deep) 100%);
    border-color: var(--pink-hot);
  }

  /* estado: bloqueado */
  .card.locked{
    background: var(--locked);
    border-color: transparent;
    color: var(--locked-text);
    cursor: not-allowed;
    box-shadow: none;
  }
  .card.locked .name, .card.locked .code, .card.locked .credits{
    color: var(--locked-text);
  }
  .card.locked:hover{ transform:none; }

  /* estado: completado */
  .card.done{
    background: var(--done);
    border-color: var(--done);
  }
  .card.done .name{
    color: var(--done-text);
    text-decoration: line-through;
    text-decoration-color: var(--pink);
    text-decoration-thickness: 1.5px;
  }
  .card.done .code, .card.done .credits{
    color: #8f7a85;
  }

  .lock-icon{ opacity:0.55; }

  .titulacion{
    margin-top: 4px;
    text-align:center;
  }
  .titulacion select{
    font-family:'Poppins', sans-serif;
    font-size: 10px;
    padding: 6px 8px;
    border-radius: 10px;
    border: 1px solid var(--pink-hot);
    background: var(--white);
    color: var(--ink);
    width: 100%;
  }

  .hidden{ display:none !important; }

  .card .grade-tag{
    position:absolute;
    top: 8px;
    right: 10px;
    font-family:'Playfair Display', serif;
    font-weight:700;
    font-size: 12px;
    padding: 1px 7px;
    border-radius: 20px;
    background: var(--pink);
    color: var(--ink);
  }
  .card.done .grade-tag{
    background: var(--pink-hot);
    color: var(--white);
  }
  .card .grade-tag.low{ background:#e79bb0; color:#3a2c33; }
  .card .grade-tag.mid{ background:#e8b4c8; }
  .card .grade-tag.high{ background:#9fd6b5; color:#243b2c; }

  /* Modal de nota */
  .overlay{
    position: fixed; inset: 0;
    background: rgba(58,44,51,0.45);
    display:flex; align-items:center; justify-content:center;
    z-index: 50;
  }
  .overlay.hidden{ display:none !important; }
  .modal{
    background: var(--white);
    border-radius: 18px;
    padding: 26px 26px 20px;
    width: 300px;
    box-shadow: var(--shadow);
    border: 1px solid var(--pink);
    text-align:center;
  }
  .modal .m-code{
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--pink-hot);
    text-transform: uppercase;
  }
  .modal .m-name{
    font-family:'Playfair Display', serif;
    font-size: 16px;
    margin: 6px 0 18px;
    color: var(--ink);
  }
  .modal input[type=number]{
    width: 100%;
    font-family:'Playfair Display', serif;
    font-size: 28px;
    text-align:center;
    padding: 10px;
    border-radius: 12px;
    border: 1px solid var(--pink-hot);
    color: var(--ink);
    background: var(--blush);
  }
  .modal .m-hint{
    font-size: 10px;
    color: var(--ink-soft);
    margin-top: 6px;
  }
  .modal .m-actions{
    display:flex;
    gap: 10px;
    margin-top: 20px;
  }
  .modal .m-actions .btn{ flex:1; }
  .m-save{ background: var(--pink-hot); color: var(--white); }

  /* Resumen académico */
  .academic-summary{
    max-width: 1100px;
    margin: 46px auto 0;
    padding: 0 24px;
  }
  .academic-summary h2{
    font-family:'Petit Formal Script', cursive;
    font-size: 32px;
    text-align:center;
    color: var(--ink);
    margin-bottom: 18px;
  }
  .sem-grades{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
  }
  .sem-grade-card{
    background: var(--white);
    border: 1px solid rgba(217,140,174,0.35);
    border-radius: 14px;
    padding: 14px;
    text-align:center;
    box-shadow: var(--shadow);
  }
  .sem-grade-card .s-label{
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .sem-grade-card .s-avg{
    font-family:'Playfair Display', serif;
    font-weight:700;
    font-size: 24px;
    color: var(--pink-hot);
    margin-top: 4px;
  }
  .sem-grade-card .s-avg.empty{
    color: var(--locked-text);
    font-size: 14px;
  }

  footer{
    text-align:center;
    margin-top: 50px;
    font-family:'Playfair Display', serif;
    font-style: italic;
    font-size: 12px;
    color: var(--ink-soft);
  }

  ::-webkit-scrollbar{ height: 10px; }
  ::-webkit-scrollbar-track{ background: var(--blush-deep); border-radius: 10px;}
  ::-webkit-scrollbar-thumb{ background: var(--pink-hot); border-radius: 10px;}

  @media (max-width: 640px){
    h1{ font-size: 48px; }
    .malla{ grid-auto-columns: 160px; }
  }
</style>
</head>

</div>

const TIT_KEY = "malla_icif_2024_titulacion";

function loadDone(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveDone(done){

  try{
    const raw = localStorage.getItem(GRADES_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveGrades(g){
  localStorage.setItem(GRADES_KEY, JSON.stringify(g));
}

let done = loadDone();
let currentTit = loadTit();
let grades = loadGrades(); // { courseId: 5.8, ... }

function allCourses(){
  return courses.concat(titulaciones[currentTit].cursos);
}

function courseById(id){
  return allCourses().find(c => c.id === id);
}

function isDone(id){ return !!done[id]; }

function semesterComplete(n){
  const inSem = allCourses().filter(c => c.sem === String(n));
  if(inSem.length === 0) return false;
  return inSem.every(c => isDone(c.id));
}

function isUnlocked(course){
  const p = course.prereq;
  if(Array.isArray(p)){
    return p.every(code => isDone(code));
  }
  if(p && p.level !== undefined){
    return semesterComplete(p.level);
  }
  if(p && p.levelRange){
    return p.levelRange.every(n => semesterComplete(n));
  }
  return true;
}

let pendingCourseId = null;

function toggleCourse(id){
  const course = courseById(id);
  if(!course) return;
  if(!isDone(id) && !isUnlocked(course)) return; // no se puede marcar si está bloqueado

  if(isDone(id)){
    // desmarcar: quita aprobado y su nota
    delete done[id];
    delete grades[id];
    saveDone(done);
    saveGrades(grades);
    render();
  } else {
    // marcar como aprobado: pedir nota
    openGradeModal(course);
  }
}

function openGradeModal(course){
  pendingCourseId = course.id;
  document.getElementById("modal-code").textContent = course.id;
  document.getElementById("modal-name").textContent = course.name;
  const input = document.getElementById("modal-input");
  input.value = grades[course.id] ?? "";
  document.getElementById("grade-overlay").classList.remove("hidden");
  setTimeout(() => input.focus(), 50);
}

function closeGradeModal(){
  document.getElementById("grade-overlay").classList.add("hidden");
  pendingCourseId = null;
}

function confirmGrade(){
  if(!pendingCourseId) return;
  const input = document.getElementById("modal-input");
  let val = input.value.trim();

  done[pendingCourseId] = true;
  if(val === ""){
    delete grades[pendingCourseId];
  } else {
    let num = parseFloat(val.replace(",", "."));
    if(isNaN(num)) num = null;
    if(num !== null){
      num = Math.min(7, Math.max(1, num));
      grades[pendingCourseId] = Math.round(num * 10) / 10;
    }
  }
  saveDone(done);
  saveGrades(grades);
  closeGradeModal();
  render();
}

document.getElementById("modal-cancel").addEventListener("click", closeGradeModal);
document.getElementById("modal-save").addEventListener("click", confirmGrade);
document.getElementById("grade-overlay").addEventListener("click", (e) => {
  if(e.target.id === "grade-overlay") closeGradeModal();
});
document.getElementById("modal-input").addEventListener("keydown", (e) => {
  if(e.key === "Enter") confirmGrade();
  if(e.key === "Escape") closeGradeModal();
});

function gradeTagClass(g){
  if(g < 4.0) return "low";
  if(g < 5.5) return "mid";
  return "high";
}

// ---------- RENDER ----------
function render(){
  const malla = document.getElementById("malla");
  malla.innerHTML = "";

  let totalDone = 0, totalAvail = 0, totalLocked = 0, totalAll = 0;

  semesters.forEach(sem => {
    const col = document.createElement("div");
    col.className = "col";

    const head = document.createElement("div");
    head.className = "col-head";
    head.innerHTML = `<div class="sem">${sem.label}</div>`;
    col.appendChild(head);

    if(sem.key === "10"){
      const titWrap = document.createElement("div");
      titWrap.className = "titulacion";
      const select = document.createElement("select");
      Object.entries(titulaciones).forEach(([key, t]) => {
        const opt = document.createElement("option");
        opt.value = key;
        opt.textContent = t.label;
        if(key === currentTit) opt.selected = true;
        select.appendChild(opt);
      });
      select.addEventListener("change", e => {
        currentTit = e.target.value;
        saveTit(currentTit);
        render();
      });
      titWrap.appendChild(select);
      col.appendChild(titWrap);
    }

    let semCourses = allCourses().filter(c => c.sem === sem.key);

    semCourses.forEach(course => {
      totalAll++;
      const card = document.createElement("div");
      card.className = "card";

      const d = isDone(course.id);
      const unlocked = isUnlocked(course);

      if(d){
        card.classList.add("done");
        totalDone++;
      } else if(unlocked){
        card.classList.add("available");
        totalAvail++;
      } else {
        card.classList.add("locked");
        totalLocked++;
      }

      let badgeHtml = "";
      if(d){
        const g = grades[course.id];
        if(g !== undefined){
          badgeHtml = `<div class="grade-tag ${gradeTagClass(g)}">${g.toFixed(1)}</div>`;
        } else {
          badgeHtml = `<div class="badge">✓</div>`;
        }
      } else if(!unlocked){
        badgeHtml = `<div class="badge lock-icon">🔒</div>`;
      }

      card.innerHTML = `
        ${badgeHtml}
        <div>
          <div class="code">${course.id}</div>
          <div class="name">${course.name}</div>
        </div>
        <div class="credits">teo ${course.teo} · prác ${course.prac} hrs/sem</div>
      `;

      card.addEventListener("click", () => toggleCourse(course.id));
      col.appendChild(card);
    });

    malla.appendChild(col);
  });

  document.getElementById("stat-done").textContent = totalDone;
  document.getElementById("stat-available").textContent = totalAvail;
  document.getElementById("stat-locked").textContent = totalLocked;
  document.getElementById("progress-count").textContent = `${totalDone} / ${totalAll} ramos`;
  const pct = totalAll ? Math.round((totalDone/totalAll)*100) : 0;
  document.getElementById("progress-pct").textContent = `${pct}%`;
  document.getElementById("progress-fill").style.width = `${pct}%`;

  renderAcademicSummary();
}

function renderAcademicSummary(){
  // PGA general
  const allGrades = Object.values(grades).filter(g => typeof g === "number");
  const pgaEl = document.getElementById("stat-pga");
  if(allGrades.length){
    const pga = allGrades.reduce((a,b) => a+b, 0) / allGrades.length;
    pgaEl.textContent = pga.toFixed(2);
  } else {
    pgaEl.textContent = "—";
  }

  // promedio por semestre (solo semestres numerados 1-10, agrupando intersem con su nivel)
  const semKeys = ["1","2","3","4","5","6","6i","7","8","8i","9","10"];
  const wrap = document.getElementById("sem-grades");
  wrap.innerHTML = "";

  semKeys.forEach(key => {
    const semLabel = semesters.find(s => s.key === key)?.label ?? key;
    const semCourses = allCourses().filter(c => c.sem === key);
    const semGrades = semCourses
      .map(c => grades[c.id])
      .filter(g => typeof g === "number");

    const card = document.createElement("div");
    card.className = "sem-grade-card";

    let avgHtml;
    if(semGrades.length){
      const avg = semGrades.reduce((a,b)=>a+b,0) / semGrades.length;
      avgHtml = `<div class="s-avg">${avg.toFixed(2)}</div>`;
    } else {
      avgHtml = `<div class="s-avg empty">sin notas</div>`;
    }

    card.innerHTML = `<div class="s-label">${semLabel}</div>${avgHtml}`;
    wrap.appendChild(card);
  });
}

document.getElementById("reset-btn").addEventListener("click", () => {
  if(confirm("¿Reiniciar toda tu malla? Esto borrará tu progreso guardado.")){
    done = {};
    saveDone(done);
    render();
  }
});

render();
</script>
